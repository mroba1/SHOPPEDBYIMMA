# Render Blueprint for the BACKEND (the storefront runs on Vercel).
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: shoppedbyimma-api
    runtime: node
    plan: starter            # persistent disks need a paid instance
    region: frankfurt        # keep Vercel's functions in the same region (vercel.json → fra1)
    buildCommand: npm ci
    startCommand: npm run backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: API_SECRET
        generateValue: true  # copy this value into Vercel's API_SECRET
      # The first admin account is created from these on first start.
      # The password is stored hashed (scrypt); change it later in Settings.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Imma
      # "Forgot password?" on the admin login asks for this key
      - key: ADMIN_RECOVERY_KEY
        generateValue: true
    disk:
      name: shop-data
      mountPath: /var/data   # db.json + uploads/ live here and survive deploys
      sizeGB: 1
