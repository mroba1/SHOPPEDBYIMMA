# Render Blueprint for the BACKEND (the website runs on Vercel).
# Render dashboard → New → Blueprint → pick this repo.
#
# Free plan: Render has no permanent disk, so the data lives in a free Neon
# Postgres database (DATABASE_URL). The backend creates its table itself.
services:
  - type: web
    name: shoppedbyimma-api
    runtime: node
    plan: free
    region: frankfurt        # keep Vercel's functions in the same region (vercel.json → fra1)
    buildCommand: npm ci
    startCommand: npm run backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Neon → your project → Connect → copy the connection string
      - key: DATABASE_URL
        sync: false
      - key: API_SECRET
        generateValue: true  # copy this value into Vercel's API_SECRET
      # The first admin account is created from these on first start.
      # The password is stored hashed (scrypt); change it later in Settings.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Imma
      # "Forgot password?" on the admin login asks for this key
      - key: ADMIN_RECOVERY_KEY
        sync: false
